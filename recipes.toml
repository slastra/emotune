# emotune mood recipes — ported from daemon.scd ~moods.
# scale = semitone set, dir = melodic drift (1 up / -1 down / 0 wander),
# base = midinote, notes = [min,max] count, dur = [min,max] sec per note,
# end = resolution degree (omit to leave hanging), synth = tone|womp|soft.

[success]
scale = [0, 2, 4, 5, 7, 9, 11]
dir = 1
base = 72
notes = [3, 5]
dur = [0.08, 0.14]
end = 7
synth = "tone"
amp = 0.22

[big_success]
scale = [0, 2, 4, 5, 7, 9, 11]
dir = 1
base = 72
notes = [6, 9]
dur = [0.07, 0.11]
end = 14
synth = "tone"
amp = 0.25
arp = true


[package]
name = "emotune"
version = "1.0.0"
edition = "2021"
description = "Chiptune mood-cue daemon: recognisable motifs on pulse, triangle, arp and noise voices"

[dependencies]
cpal = "0.15"
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
